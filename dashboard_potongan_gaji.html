<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Salary Deduction Control Center</title><style>
:root{--bg:#f5f7fb;--nav:#101c38;--nav2:#1a2d50;--primary:#315bdb;--primary2:#eaf0ff;--txt:#17233e;--muted:#71809a;--border:#e4e9f3;--green:#119a74;--red:#dc4d63;--amber:#cc8624;--white:#fff;--shadow:0 7px 24px rgba(26,43,79,.055)}*{box-sizing:border-box}body{margin:0;font:14px/1.5 Inter,Segoe UI,Arial,sans-serif;color:var(--txt);background:var(--bg)}button,input,select{font:inherit}button{cursor:pointer}.shell{display:flex;min-height:100vh}.sidebar{width:245px;background:var(--nav);color:#fff;padding:27px 16px;position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column}.brand{display:flex;gap:11px;align-items:center;padding:0 12px 31px;font-weight:800;font-size:17px;line-height:1.15}.brandicon{width:39px;height:39px;display:grid;place-items:center;border-radius:11px;background:#4774ef;font-size:22px}.brand small{display:block;color:#93a8d1;font-weight:500;font-size:11px;margin-top:4px}.navlabel{color:#8195ba;font-size:10px;letter-spacing:2px;padding:0 13px;margin:7px 0 12px;font-weight:bold}.nav{background:none;border:0;width:100%;padding:12px 14px;text-align:left;color:#b0c0dc;display:flex;align-items:center;gap:13px;border-radius:10px;margin:3px 0}.nav.active{background:#284474;color:white;font-weight:700}.nav:hover{background:#23395e;color:white}.nav .sym{font-size:19px;width:22px;text-align:center}.nav b{margin-left:auto;background:#eb5c72;color:#fff;border-radius:7px;padding:1px 7px;font-size:11px}.sidebottom{margin-top:auto;background:#1c3051;padding:15px;border-radius:12px;color:#c5d1e8;font-size:12px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#24c79c;margin-right:7px}.main{margin-left:245px;width:calc(100% - 245px);padding:0 32px 44px}.top{height:81px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);gap:14px}.crumb{font-size:13px;color:var(--muted)}.crumb strong{color:var(--txt)}.userpanel{display:flex;gap:10px;align-items:center}.avatar{height:36px;width:36px;border-radius:50%;background:#dbe5ff;color:#365aca;display:grid;place-items:center;font-weight:bold}.userpanel select{border:none;background:transparent;color:var(--txt);font-weight:700;max-width:195px}.content{max-width:1450px;margin:auto}.head{display:flex;justify-content:space-between;align-items:flex-start;margin:30px 0 24px;gap:12px;flex-wrap:wrap}h1{font-size:26px;margin:0 0 7px;letter-spacing:-.6px}h2{font-size:16px;margin:0}p{margin:0}.sub{color:var(--muted);font-size:13px}.btn{border:1px solid var(--border);background:#fff;color:#324665;border-radius:9px;padding:10px 14px;font-weight:650;display:inline-flex;align-items:center;gap:8px}.btn.primary{background:var(--primary);color:white;border-color:var(--primary)}.btn.danger{color:var(--red)}.btn.small{font-size:12px;padding:6px 9px}.btn:hover{filter:brightness(.96)}.actions{display:flex;gap:9px;flex-wrap:wrap}.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.card{background:#fff;border:1px solid var(--border);box-shadow:var(--shadow);border-radius:13px}.kpi{padding:21px}.kpitop{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px}.tileicon{width:34px;height:34px;display:grid;place-items:center;background:#edf1ff;color:#315bdb;border-radius:10px;font-size:18px}.kpinum{font-size:26px;font-weight:800;letter-spacing:-.9px;margin:12px 0 5px;white-space:nowrap}.kpinote{color:var(--muted);font-size:11px}.green{color:var(--green)}.red{color:var(--red)}.amber{color:var(--amber)}.sectionrow{display:grid;grid-template-columns:1.55fr 1fr;gap:18px;margin-top:20px}.panel{padding:22px}.panelheader{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:8px}.tag{display:inline-flex;align-items:center;border-radius:20px;background:#f1f4fa;padding:4px 10px;color:#64718a;font-weight:650;font-size:11px}.tag.red{background:#ffedf0;color:#c53d57}.tag.green{background:#e5f8f0;color:#0f986f}.tag.amber{background:#fff4df;color:#bd8024}.barrow{display:grid;grid-template-columns:86px 1fr 80px;align-items:center;gap:12px;margin:17px 0;font-size:12px}.barwrap{height:11px;border-radius:50px;background:#eef1f7;overflow:hidden}.bar{height:100%;background:#5478e8;border-radius:50px}.legend{display:flex;flex-wrap:wrap;gap:13px;margin-top:18px;font-size:11px;color:var(--muted)}.legend span:before{content:' ';display:inline-block;width:9px;height:9px;background:#4169dd;border-radius:3px;margin-right:6px}.tablewrap{overflow-x:auto}.data{width:100%;border-collapse:collapse;font-size:12px;white-space:nowrap}.data th{text-align:left;background:#f7f9fd;color:#70809a;font-size:11px;letter-spacing:.2px;font-weight:700;padding:13px 12px}.data td{padding:13px 12px;border-bottom:1px solid #edf0f6}.data tr:last-child td{border:0}.data tr:hover td{background:#fafbff}.tablepanel{margin-top:20px;overflow:hidden}.tablepanel .panelheader{padding:21px 22px 0}.tablepanel .tablewrap{padding:0 17px 15px}.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:17px}.field{background:#fff;border:1px solid var(--border);border-radius:9px;padding:10px 12px;outline:none;color:var(--txt);min-width:120px}.field:focus{border-color:#7997ed}.search{min-width:270px}.note{padding:14px 16px;border-radius:10px;background:#f0f5ff;color:#45608c;font-size:12px;margin-bottom:17px}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:18px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.formgroup{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700;color:#53617b}.formgroup .field{width:100%;font-weight:400}.formgroup.full{grid-column:1/-1}.divider{height:1px;background:var(--border);margin:20px 0}.stack{display:flex;flex-direction:column;gap:12px}.upload{border:2px dashed #c9d5f2;padding:28px 20px;border-radius:12px;text-align:center;background:#f9fbff}.upload strong{display:block;margin:9px 0}.bigicon{font-size:31px}.priority{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.priority span{padding:8px 12px;background:#eff3ff;color:#365cd0;border-radius:8px;font-size:12px;font-weight:750}.priority i{font-style:normal;color:#92a2bd}.empty{padding:30px;text-align:center;color:var(--muted)}.toast{position:fixed;bottom:24px;right:24px;background:#1d3455;color:white;padding:13px 17px;border-radius:10px;box-shadow:0 10px 35px #0003;display:none;max-width:380px;z-index:10}.hidden{display:none!important}footer{color:#98a5b9;font-size:11px;margin-top:30px}.split{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.summarypill{font-weight:750}.minigrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.mini{background:#f6f8fd;border-radius:9px;padding:12px}.mini strong{font-size:18px;display:block}.tiny{font-size:11px;color:var(--muted)}@media(max-width:1050px){.kpis{grid-template-columns:repeat(2,1fr)}.sectionrow,.twocol{grid-template-columns:1fr}.main{padding:0 19px 35px}}@media(max-width:680px){.sidebar{width:66px;padding:22px 8px}.brand{padding:0 4px 25px}.brand>div:last-child,.navlabel,.nav .title,.nav b,.sidebottom{display:none}.nav{justify-content:center;padding:12px 0}.main{margin-left:66px;width:calc(100% - 66px);padding:0 12px}.kpis{grid-template-columns:1fr 1fr;gap:9px}.kpi{padding:13px}.kpinum{font-size:18px}.formgrid{grid-template-columns:1fr}.formgroup.full{grid-column:auto}h1{font-size:22px}.search{min-width:170px}.userpanel select{max-width:115px}}
</style></head><body><div class="shell"><aside class="sidebar"><div class="brand"><div class="brandicon">▦</div><div>PAYROLL<small>Deduction System</small></div></div><div class="navlabel">MENU UTAMA</div><button class="nav active" data-page="home"><span class="sym">⌂</span><span class="title">Home</span></button><button class="nav" data-page="outstanding"><span class="sym">◷</span><span class="title">Outstanding</span><b id="navCount">0</b></button><button class="nav" data-page="input"><span class="sym">⊞</span><span class="title">Input Data</span></button><button class="nav" data-page="report"><span class="sym">▤</span><span class="title">Report & Histori</span></button><button class="nav" data-page="employee"><span class="sym">♙</span><span class="title">Data Karyawan</span></button><div class="sidebottom"><div><span class="dot"></span>Mode demo aktif</div><div style="margin-top:8px;color:#8498b9">Data disimpan di browser ini.</div></div></aside><main class="main"><div class="top"><div class="crumb">Salary Management <span style="margin:0 9px">/</span><strong id="breadcrumb">Home</strong></div><div class="userpanel"><span class="dot"></span><select id="currentUser" aria-label="Pengguna aktif"><option value="Admin Payroll">Admin Payroll</option><option value="PIC COD">PIC COD</option><option value="PIC CX">PIC CX</option><option value="PIC Treasury">PIC Treasury</option><option value="PIC QSE">PIC QSE</option><option value="PIC Koperasi">PIC Koperasi</option></select><div class="avatar" id="avatar">AP</div></div></div><div class="content" id="content"></div><footer>Payroll Deduction Control Center • Prototipe interaktif • Nominal, nama, dan catatan awal merupakan data simulasi.</footer></main></div><div id="toast" class="toast"></div><script>
const PRI=['COD','CX','Treasury','QSE','Koperasi'];const KEY='payroll_control_demo_v3';const rup=n=>'Rp '+Math.round(Number(n||0)).toLocaleString('id-ID');const fmt=n=>Math.round(Number(n||0)).toLocaleString('id-ID');const today=()=>new Date().toISOString().slice(0,10);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const seed=()=>({employees:[{id:'0922.12592',name:'Andi Pratama',status:'AKTIF',salary:4800000,branch:'Jakarta'},{id:'1124.16723',name:'Budi Santoso',status:'RESIGN',salary:1400000,branch:'Depok'},{id:'0425.17072',name:'Citra Lestari',status:'AKTIF',salary:3250000,branch:'Bekasi'},{id:'0724.16173',name:'Dedi Saputra',status:'RESIGN',salary:300000,branch:'Tangerang'},{id:'1023.14269',name:'Eka Putri',status:'RESIGN',salary:0,branch:'Bogor'},{id:'0820.8305',name:'Fajar Maulana',status:'AKTIF',salary:2600000,branch:'Jakarta'}],cases:[{id:'D001',npk:'1124.16723',division:'COD',type:'Fraud COD',ref:'CGK109231',amount:1800000,date:'2026-10-01'},{id:'D002',npk:'1124.16723',division:'CX',type:'Barang hilang',ref:'CGK102003',amount:950000,date:'2026-10-03'},{id:'D003',npk:'1124.16723',division:'QSE',type:'Pelanggaran SOP',ref:'TKT-1132',amount:420000,date:'2026-10-04'},{id:'D004',npk:'0724.16173',division:'Treasury',type:'Selisih kas',ref:'TRS-2933',amount:1500000,date:'2026-10-01'},{id:'D005',npk:'0724.16173',division:'Koperasi',type:'Pinjaman',ref:'KOP-9423',amount:950000,date:'2026-10-03'},{id:'D006',npk:'1023.14269',division:'COD',type:'Fraud COD',ref:'CGK120212',amount:820000,date:'2026-10-02'},{id:'D007',npk:'0922.12592',division:'CX',type:'Barang rusak',ref:'CGK444122',amount:230000,date:'2026-10-05'},{id:'D008',npk:'0425.17072',division:'Koperasi',type:'Pinjaman',ref:'KOP-3002',amount:620000,date:'2026-10-07'},{id:'D009',npk:'0820.8305',division:'QSE',type:'Pelanggaran SOP',ref:'TKT-9912',amount:190000,date:'2026-10-08'},{id:'D010',npk:'1124.16723',division:'Treasury',type:'Selisih kas',ref:'TRS-1102',amount:680000,date:'2026-10-06'}],payments:[],seq:11,pseq:1});let db;try{db=JSON.parse(localStorage.getItem(KEY))||seed()}catch{db=seed()}let page='home';const save=()=>localStorage.setItem(KEY,JSON.stringify(db));const emp=id=>db.employees.find(e=>e.id===id);const paid=c=>db.payments.filter(p=>p.caseId===c.id).reduce((s,p)=>s+p.amount,0);const remaining=c=>Math.max(0,c.amount-paid(c));const salaryUsed=npk=>db.payments.filter(p=>p.npk===npk).reduce((s,p)=>s+p.amount,0);const salaryLeft=e=>Math.max(0,e.salary-salaryUsed(e.id));const outstanding=()=>db.cases.filter(c=>remaining(c)>0&&(emp(c.npk)?.status==='RESIGN'||salaryLeft(emp(c.npk))<remaining(c)));const outstandingTotal=()=>outstanding().reduce((s,c)=>s+remaining(c),0);const user=()=>document.getElementById('currentUser').value;const userDiv=()=>user().startsWith('PIC ')?user().slice(4):null;const isAdmin=()=>!userDiv();const eligibleCases=()=>db.cases.filter(c=>!userDiv()||c.division===userDiv());let toastTimer;function notify(m){const el=document.getElementById('toast');el.textContent=m;el.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.style.display='none',4200)}function layout(title,sub,buttons=''){return `<div class="head"><div><h1>${title}</h1><p class="sub">${sub}</p></div><div class="actions">${buttons}</div></div>`}function kpi(title,num,note,icon='▦',color=''){return `<div class="card kpi"><div class="kpitop"><span>${title}</span><span class="tileicon">${icon}</span></div><div class="kpinum ${color}">${num}</div><div class="kpinote">${note}</div></div>`}function badge(s){const cls=s==='RESIGN'||s==='OUTSTANDING'?'red':s==='LUNAS'||s==='AKTIF'?'green':'amber';return `<span class="tag ${cls}">${esc(s)}</span>`}function caseState(c){if(remaining(c)===0)return 'LUNAS';const e=emp(c.npk);return !e||e.status==='RESIGN'||salaryLeft(e)<remaining(c)?'OUTSTANDING':'BELUM DIPOTONG'}function tHead(a){return `<thead><tr>${a.map(x=>`<th>${x}</th>`).join('')}</tr></thead>`}function empty(n=7){return `<tr><td colspan="${n}" class="empty">Tidak ada data untuk filter ini.</td></tr>`}
function renderHome(){const total=db.cases.reduce((s,c)=>s+c.amount,0),processed=db.payments.reduce((s,p)=>s+p.amount,0),os=outstanding();const sums=PRI.map(d=>({name:d,amount:db.cases.filter(c=>c.division===d).reduce((s,c)=>s+c.amount,0)}));const max=Math.max(1,...sums.map(x=>x.amount));const totalRes=db.employees.filter(e=>e.status==='RESIGN').length;return layout(`Selamat datang, ${esc(user())} 👋`,'Pantau seluruh potongan gaji, status karyawan, dan outstanding dalam satu dashboard.',`<button class="btn" onclick="downloadReport()">↓ Ekspor Report</button><button class="btn primary" onclick="go('input')">＋ Input Potongan</button>`)+`<div class="kpis">${kpi('Total Tagihan Potongan',rup(total),db.cases.length+' transaksi potongan','▤')}${kpi('Potongan Terealisasi',rup(processed),'Dana sudah dialokasikan','✓','green')}${kpi('Total Outstanding',rup(outstandingTotal()),os.length+' case perlu tindak lanjut','!','red')}${kpi('Karyawan Resign',fmt(totalRes),db.employees.length+' karyawan terdata','♙')}</div><div class="sectionrow"><div class="card panel"><div class="panelheader"><h2>Komposisi Tagihan per Divisi</h2><span class="tag">Seluruh Periode</span></div>${sums.map(x=>`<div class="barrow"><strong>${x.name}</strong><div class="barwrap"><div class="bar" style="width:${x.amount/max*100}%"></div></div><span style="text-align:right;font-weight:700">${rup(x.amount)}</span></div>`).join('')}<div class="legend"><span>Total nominal pengajuan potongan</span></div></div><div class="card panel"><div class="panelheader"><h2>Prioritas Potongan Resign</h2><span class="tag amber">Otomatis</span></div><p class="sub" style="margin-bottom:19px">Ketika karyawan resign, sisa gaji dialokasikan berurutan sesuai kebijakan prioritas.</p><div class="priority">${PRI.map((d,i)=>`<span>${i+1}. ${d}</span>${i<4?'<i>→</i>':''}`).join('')}</div><div class="divider"></div><div class="minigrid"><div class="mini"><span class="tiny">Total karyawan</span><strong>${db.employees.length}</strong></div><div class="mini"><span class="tiny">Resign</span><strong>${totalRes}</strong></div><div class="mini"><span class="tiny">Belum lunas</span><strong>${db.cases.filter(c=>remaining(c)>0).length}</strong></div></div><p class="tiny" style="margin-top:16px">Gunakan menu Data Karyawan untuk mengubah status/sisa gaji, kemudian jalankan simulasi alokasi.</p></div></div><div class="card tablepanel"><div class="panelheader"><h2>Outstanding Terbaru</h2><button class="btn small" onclick="go('outstanding')">Lihat Semua →</button></div><div class="tablewrap"><table class="data">${tHead(['NPK','Nama Karyawan','Divisi','Case','Sisa Tagihan','Status'])}<tbody>${os.slice(0,6).map(c=>`<tr><td>${esc(c.npk)}</td><td>${esc(emp(c.npk)?.name||'—')}</td><td>${esc(c.division)}</td><td>${esc(c.ref)}</td><td class="red"><b>${rup(remaining(c))}</b></td><td>${badge('OUTSTANDING')}</td></tr>`).join('')||empty(6)}</tbody></table></div></div>`}
function renderOutstanding(){const os=outstanding().filter(c=>!userDiv()||c.division===userDiv());let byEmp=[...new Set(os.map(c=>c.npk))].length;return layout('Outstanding Potongan','Daftar tagihan tidak tertutup oleh sisa gaji atau berasal dari karyawan resign.',`<button class="btn" onclick="downloadOutstanding()">↓ Ekspor CSV</button>`)+`<div class="kpis">${kpi('Total Outstanding',rup(os.reduce((s,c)=>s+remaining(c),0)),'Sisa tagihan bermasalah','!','red')}${kpi('Total Case',fmt(os.length),'Kasus membutuhkan tindak lanjut','▤')}${kpi('Karyawan Terdampak',fmt(byEmp),'NPK dengan tagihan outstanding','♙')}${kpi('Sisa Gaji Resign',rup(db.employees.filter(e=>e.status==='RESIGN').reduce((s,e)=>s+salaryLeft(e),0)),'Saldo belum dialokasikan','▦')}</div><div class="card panel" style="margin-top:20px"><div class="filters"><input class="field search" id="osSearch" placeholder="Cari NPK, nama, atau AWB/case" oninput="filterOs()"><select class="field" id="osDiv" onchange="filterOs()"><option value="">Semua Divisi</option>${PRI.filter(d=>!userDiv()||userDiv()===d).map(d=>`<option>${d}</option>`).join('')}</select><select class="field" id="osReason" onchange="filterOs()"><option value="">Semua Penyebab</option><option value="RESIGN">Resign</option><option value="SALDO">Gaji tidak cukup</option></select></div><div class="tablewrap"><table class="data">${tHead(['NPK','Nama','Status','Divisi','No. Case / AWB','Sisa Gaji','Sisa Tagihan','Penyebab'])}<tbody id="osBody"></tbody></table></div></div>`}
function filterOs(){const q=(document.getElementById('osSearch')?.value||'').toLowerCase(),d=document.getElementById('osDiv')?.value||'',why=document.getElementById('osReason')?.value||'';let arr=outstanding().filter(c=>{const e=emp(c.npk);const reason=e.status==='RESIGN'?'RESIGN':'SALDO';return (!userDiv()||c.division===userDiv())&&(!d||c.division===d)&&(!why||why===reason)&&[c.npk,e.name,c.ref,c.type].some(x=>x.toLowerCase().includes(q))});document.getElementById('osBody').innerHTML=arr.map(c=>{const e=emp(c.npk);return `<tr><td>${esc(c.npk)}</td><td>${esc(e.name)}</td><td>${badge(e.status)}</td><td>${esc(c.division)}</td><td>${esc(c.ref)}</td><td>${rup(salaryLeft(e))}</td><td class="red"><b>${rup(remaining(c))}</b></td><td>${e.status==='RESIGN'?'Resign':'Sisa gaji tidak cukup'}</td></tr>`}).join('')||empty(8)}
function renderInput(){return layout('Input Data Potongan','Tambah pengajuan potongan secara manual atau impor sekaligus menggunakan template.',`<button class="btn" onclick="downloadTemplate()">↓ Download Template CSV</button>`)+`<div class="twocol"><div class="card panel"><div class="panelheader"><h2>Input Manual</h2><span class="tag green">Form Entry</span></div><form class="formgrid" id="caseForm" onsubmit="addCase(event)"><label class="formgroup">NPK Karyawan<select class="field" required name="npk"><option value="">Pilih NPK</option>${db.employees.map(e=>`<option value="${esc(e.id)}">${esc(e.id)} — ${esc(e.name)}</option>`).join('')}</select></label><label class="formgroup">Divisi<select class="field" required name="division">${PRI.filter(d=>!userDiv()||userDiv()===d).map(x=>`<option>${x}</option>`).join('')}</select></label><label class="formgroup">Jenis Case<input class="field" name="type" required placeholder="Contoh: Fraud COD"></label><label class="formgroup">No. AWB / Tiket / Case<input class="field" name="ref" required placeholder="Contoh: CGK12345"></label><label class="formgroup">Nominal Potongan (Rp)<input class="field" name="amount" required type="number" min="1" step="1" placeholder="Contoh: 100000"></label><label class="formgroup">Tanggal Pengajuan<input class="field" name="date" required type="date" value="${today()}"></label><div class="formgroup full"><button class="btn primary" type="submit" style="justify-content:center">＋ Simpan Pengajuan Potongan</button></div></form><div class="note" style="margin-top:22px;margin-bottom:0">Setiap pengajuan tercatat sebagai tagihan. Nilai terpotong baru dihitung ketika alokasi gaji dijalankan. NPK tidak dikenal akan ditolak saat impor.</div></div><div class="card panel"><div class="panelheader"><h2>Bulk Upload</h2><span class="tag">CSV</span></div><div class="upload"><div class="bigicon">⇧</div><strong>Import Potongan Massal</strong><p class="sub">Gunakan file CSV berisi NPK, Divisi, Jenis Case, No. Case, Nominal, dan Tanggal.</p><input type="file" id="bulkfile" accept=".csv,text/csv" style="margin:19px auto;display:block;max-width:100%"><button class="btn primary" onclick="importCSV()">Impor File CSV</button></div><div class="divider"></div><h2 style="margin-bottom:10px">Panduan Input</h2><p class="sub">1. Download template yang tersedia.</p><p class="sub">2. Isi data sesuai kolom contoh dan simpan sebagai CSV UTF-8.</p><p class="sub">3. Upload file. Validasi NPK, divisi, nominal, dan duplikasi case akan berjalan otomatis.</p><p class="sub">4. Tinjau status di Outstanding dan Report.</p><div class="note" style="margin-top:19px">Akses demonstrasi: PIC divisi hanya bisa menambahkan dan melihat pengajuan divisinya. Admin Payroll dapat melihat seluruh divisi.</div></div></div>`}
function addCase(ev){ev.preventDefault();const f=Object.fromEntries(new FormData(ev.target));if(!emp(f.npk)){notify('NPK tidak terdaftar.');return}if(userDiv()&&f.division!==userDiv()){notify('Divisi tidak sesuai hak akses.');return}if(Number(f.amount)<=0){notify('Nominal harus positif');return}if(db.cases.some(c=>c.division===f.division&&c.ref.toUpperCase()===f.ref.trim().toUpperCase())){notify('Nomor Case telah tercatat di divisi tersebut.');return}db.cases.unshift({...f,id:'D'+String(db.seq++).padStart(4,'0'),ref:f.ref.trim(),amount:Number(f.amount)});save();render();notify('Pengajuan berhasil disimpan. Belum ada dana terpotong.')}
function renderEmployees(){return layout('Data Karyawan & Alokasi','Pantau status aktif/resign, gaji tersedia, serta simulasikan prioritas alokasi.',`<button class="btn primary" ${!isAdmin()?'disabled title="Hanya Admin Payroll"':''} onclick="allocateAll()">▶ Jalankan Alokasi Semua</button>`)+`<div class="note">Khusus karyawan RESIGN: alokasi selalu mengikuti <b>COD → CX → Treasury → QSE → Koperasi</b>. Pada karyawan AKTIF, versi demo menggunakan urutan pengajuan tertua lebih dahulu. Alokasi bersifat mencatat potongan, bukan memproses payroll sebenarnya.</div><div class="card panel"><div class="tablewrap"><table class="data">${tHead(['NPK','Nama / Cabang','Status Karyawan','Saldo Gaji Awal','Sudah Dipotong','Sisa Gaji','Tagihan Tersisa','Tindakan'])}<tbody>${db.employees.map(e=>`<tr><td>${esc(e.id)}</td><td><b>${esc(e.name)}</b><div class="tiny">${esc(e.branch)}</div></td><td>${isAdmin()?`<select class="field" onchange="editStatus('${esc(e.id)}',this.value)"><option value="AKTIF" ${e.status==='AKTIF'?'selected':''}>AKTIF</option><option value="RESIGN" ${e.status==='RESIGN'?'selected':''}>RESIGN</option></select>`:badge(e.status)}</td><td>${isAdmin()?`<input class="field" style="width:120px" type="number" min="${salaryUsed(e.id)}" value="${e.salary}" onchange="editSalary('${esc(e.id)}',this.value)">`:rup(e.salary)}</td><td>${rup(salaryUsed(e.id))}</td><td><strong>${rup(salaryLeft(e))}</strong></td><td class="${db.cases.some(c=>c.npk===e.id&&remaining(c)>0)?'red':''}">${rup(db.cases.filter(c=>c.npk===e.id).reduce((s,c)=>s+remaining(c),0))}</td><td><button class="btn small" ${!isAdmin()?'disabled':''} onclick="allocate('${esc(e.id)}')">Alokasikan</button></td></tr>`).join('')}</tbody></table></div></div><div class="card panel" style="margin-top:18px"><div class="panelheader"><h2>Tambah Karyawan</h2><span class="tag">Master Data</span></div><form class="formgrid" onsubmit="addEmployee(event)"><label class="formgroup">NPK<input required class="field" name="npk" placeholder="Contoh: 1234.56789" ${!isAdmin()?'disabled':''}></label><label class="formgroup">Nama Karyawan<input required class="field" name="name" placeholder="Nama lengkap" ${!isAdmin()?'disabled':''}></label><label class="formgroup">Cabang<input required class="field" name="branch" placeholder="Cabang / area" ${!isAdmin()?'disabled':''}></label><label class="formgroup">Sisa Gaji Awal (Rp)<input required type="number" min="0" class="field" name="salary" ${!isAdmin()?'disabled':''}></label><label class="formgroup">Status<select class="field" name="status" ${!isAdmin()?'disabled':''}><option>AKTIF</option><option>RESIGN</option></select></label><div class="formgroup" style="justify-content:end"><button type="submit" class="btn primary" ${!isAdmin()?'disabled':''}>＋ Tambah Karyawan</button></div></form></div>`}
function editStatus(id,v){if(!isAdmin())return;emp(id).status=v;save();render();notify('Status karyawan diperbarui; jalankan alokasi untuk menghitung potongan.')};function editSalary(id,v){if(!isAdmin())return;const e=emp(id),n=Number(v);if(!Number.isFinite(n)||n<salaryUsed(id)){notify('Sisa gaji awal tidak bisa kurang dari total yang telah dipotong.');render();return}e.salary=n;save();render();notify('Saldo gaji awal diperbarui.')};function addEmployee(ev){ev.preventDefault();if(!isAdmin())return;const f=Object.fromEntries(new FormData(ev.target));if(db.employees.some(x=>x.id===f.npk.trim())){notify('NPK sudah ada.');return}db.employees.push({id:f.npk.trim(),name:f.name.trim(),branch:f.branch.trim(),status:f.status,salary:Number(f.salary)});save();render();notify('Master karyawan berhasil ditambah.')}
function allocate(id,quiet=false){if(!isAdmin()){notify('Hanya Admin Payroll yang dapat menjalankan alokasi.');return}const e=emp(id);if(!e)return;let balance=salaryLeft(e),list=db.cases.filter(c=>c.npk===id&&remaining(c)>0);list.sort((a,b)=>e.status==='RESIGN'?(PRI.indexOf(a.division)-PRI.indexOf(b.division)||a.date.localeCompare(b.date)||a.id.localeCompare(b.id)):(a.date.localeCompare(b.date)||a.id.localeCompare(b.id)));let count=0,allocated=0;for(const c of list){let value=Math.min(balance,remaining(c));if(value<=0)break;db.payments.push({id:'P'+String(db.pseq++).padStart(5,'0'),caseId:c.id,npk:id,division:c.division,amount:value,date:today(),by:user(),period:today().slice(0,7)});balance-=value;allocated+=value;count++}save();if(!quiet){render();notify(count?`${count} case dialokasikan: ${rup(allocated)}. Sisa gaji: ${rup(balance)}.`:'Tidak ada saldo gaji atau tagihan yang dapat dialokasikan.')}return {count,allocated}}function allocateAll(){if(!isAdmin())return;let n=0,amount=0;for(const e of db.employees){const x=allocate(e.id,true);n+=x.count;amount+=x.allocated}render();notify(`Alokasi selesai: ${n} case, total ${rup(amount)}.`)}
function renderReport(){return layout('Report & Historical Potongan','Rekap potongan per periode, sisa outstanding, dan audit histori alokasi.',`<button class="btn" onclick="downloadReport()">↓ Ekspor Histori CSV</button>`)+`<div class="filters"><label class="formgroup">Periode Transaksi<input class="field" id="reportMonth" type="month" value="${reportPeriod}" onchange="reportPeriod=this.value;updateReport()"></label><label class="formgroup">Divisi<select class="field" id="reportDiv" onchange="updateReport()"><option value="">Semua Divisi</option>${PRI.filter(d=>!userDiv()||userDiv()===d).map(d=>`<option>${d}</option>`).join('')}</select></label></div><div id="reportSummary"></div><div class="card tablepanel"><div class="panelheader"><h2>Historical Realisasi Potongan</h2><span class="tag">Jejak Audit</span></div><div class="tablewrap"><table class="data">${tHead(['Tanggal','Periode','NPK','Nama Karyawan','Divisi','No. Case','Nominal Terpotong','Dicatat Oleh'])}<tbody id="reportBody"></tbody></table></div></div><div class="card tablepanel"><div class="panelheader"><h2>Rekap Seluruh Tagihan & Outstanding</h2></div><div class="tablewrap"><table class="data">${tHead(['Divisi','Total Tagihan','Total Terpotong','Sisa Tagihan','Outstanding Khusus','Jumlah Case'])}<tbody id="reportDivBody"></tbody></table></div></div>`}let reportPeriod=today().slice(0,7);function updateReport(){const period=document.getElementById('reportMonth')?.value||'',div=document.getElementById('reportDiv')?.value||'';const ps=db.payments.filter(p=>(!period||p.period===period)&&(!div||p.division===div)&&(!userDiv()||p.division===userDiv()));const cs=eligibleCases().filter(c=>!div||c.division===div);const touched=new Set(ps.map(p=>p.caseId));document.getElementById('reportSummary').innerHTML=`<div class="kpis" style="margin-bottom:20px">${kpi('Realisasi Periode',rup(ps.reduce((s,p)=>s+p.amount,0)),'Total alokasi pada periode terpilih','✓','green')}${kpi('Case Terpotong',fmt(touched.size),'Jumlah case dengan alokasi di periode','▤')}${kpi('Outstanding Saat Ini',rup(cs.filter(c=>outstanding().includes(c)).reduce((s,c)=>s+remaining(c),0)),'Tidak dibatasi periode transaksi','!','red')}${kpi('Total Sisa Tagihan',rup(cs.reduce((s,c)=>s+remaining(c),0)),'Seluruh periode pengajuan','◷')}</div>`;document.getElementById('reportBody').innerHTML=ps.slice().reverse().map(p=>{const c=db.cases.find(x=>x.id===p.caseId);return `<tr><td>${esc(p.date)}</td><td>${esc(p.period)}</td><td>${esc(p.npk)}</td><td>${esc(emp(p.npk)?.name||'—')}</td><td>${esc(p.division)}</td><td>${esc(c?.ref||'—')}</td><td class="green"><b>${rup(p.amount)}</b></td><td>${esc(p.by)}</td></tr>`}).join('')||empty(8);document.getElementById('reportDivBody').innerHTML=PRI.filter(d=>!userDiv()||d===userDiv()).filter(d=>!div||d===div).map(d=>{const c=cs.filter(x=>x.division===d),total=c.reduce((s,x)=>s+x.amount,0),p=c.reduce((s,x)=>s+paid(x),0);return `<tr><td><b>${d}</b></td><td>${rup(total)}</td><td class="green">${rup(p)}</td><td>${rup(total-p)}</td><td class="red">${rup(c.filter(x=>outstanding().includes(x)).reduce((s,x)=>s+remaining(x),0))}</td><td>${c.length}</td></tr>`}).join('')||empty(6)}
function csvEscape(x){return '"'+String(x??'').replace(/"/g,'""')+'"'}function csvDownload(name,rows){let txt='\uFEFF'+rows.map(row=>row.map(csvEscape).join(';')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/csv;charset=utf-8;'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function downloadTemplate(){csvDownload('template_input_potongan.csv',[['NPK','Divisi','Jenis Case','No Case','Nominal','Tanggal'],['0922.12592','COD','Fraud COD','CGK-CONTOH-001','100000','2026-10-15']])}function downloadOutstanding(){csvDownload('outstanding_potongan.csv',[['NPK','Nama','Status','Divisi','No Case','Sisa Gaji','Sisa Tagihan','Penyebab'],...outstanding().filter(c=>!userDiv()||c.division===userDiv()).map(c=>{const e=emp(c.npk);return [c.npk,e.name,e.status,c.division,c.ref,salaryLeft(e),remaining(c),e.status==='RESIGN'?'Resign':'Gaji tidak cukup']})])}function downloadReport(){csvDownload('history_potongan.csv',[['Tanggal','Periode','NPK','Nama','Divisi','No Case','Nominal Terpotong','Oleh'],...db.payments.filter(p=>!userDiv()||p.division===userDiv()).map(p=>[p.date,p.period,p.npk,emp(p.npk)?.name,p.division,db.cases.find(c=>c.id===p.caseId)?.ref,p.amount,p.by])])}
function parseCSV(text){const delimiter=(text.split(/\r?\n/)[0].match(/;/g)||[]).length>=(text.split(/\r?\n/)[0].match(/,/g)||[]).length?';':',';let rows=[],r=[],v='',quote=false;for(let i=0;i<text.length;i++){let ch=text[i];if(ch==='"'){if(quote&&text[i+1]==='"'){v+='"';i++}else quote=!quote}else if(!quote&&ch===delimiter){r.push(v);v=''}else if(!quote&&(ch==='\n'||ch==='\r')){if(ch==='\r'&&text[i+1]==='\n')i++;r.push(v);if(r.some(x=>x.trim()))rows.push(r);r=[];v=''}else v+=ch}r.push(v);if(r.some(x=>x.trim()))rows.push(r);return rows}
async function importCSV(){const file=document.getElementById('bulkfile').files[0];if(!file){notify('Pilih file CSV terlebih dahulu.');return}let rows=parseCSV((await file.text()).replace(/^\uFEFF/,''));if(rows.length<2){notify('Template kosong atau format CSV tidak sesuai.');return}const headers=rows[0].map(x=>x.trim().toLowerCase());const expected=['npk','divisi','jenis case','no case','nominal','tanggal'];if(expected.some((h,i)=>headers[i]!==h)){notify('Header tidak sesuai. Download template dan gunakan urutan kolom asli.');return}let accepted=[],errors=[],keys=new Set(db.cases.map(c=>c.division+'|'+c.ref.toUpperCase()));rows.slice(1).forEach((r,i)=>{let [npk,division,type,ref,raw,date]=r.map(x=>(x||'').trim());let amount=Number(raw.replace(/\./g,'').replace(/,/g,'.'));let k=division+'|'+ref.toUpperCase();if(!emp(npk)||!PRI.includes(division)||(userDiv()&&division!==userDiv())||!ref||!type||!(amount>0)||!/\d{4}-\d{2}-\d{2}/.test(date)||keys.has(k)){errors.push(i+2);return}keys.add(k);accepted.push({id:'D'+String(db.seq++).padStart(4,'0'),npk,division,type,ref,amount,date})});if(errors.length){notify('Impor dibatalkan. Baris bermasalah: '+errors.slice(0,12).join(', ')+(errors.length>12?' ...':''));return}db.cases.unshift(...accepted);save();render();notify(`${accepted.length} pengajuan berhasil diimpor. Belum dipotong dari gaji.`)}
function render(){document.getElementById('breadcrumb').textContent=({home:'Home',outstanding:'Outstanding',input:'Input Data',report:'Report & Histori',employee:'Data Karyawan'})[page];document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.page===page));document.getElementById('navCount').textContent=outstanding().filter(c=>!userDiv()||c.division===userDiv()).length;document.getElementById('avatar').textContent=user().split(' ').map(x=>x[0]).slice(0,2).join('');document.getElementById('content').innerHTML=({home:renderHome,outstanding:renderOutstanding,input:renderInput,report:renderReport,employee:renderEmployees})[page]();if(page==='outstanding')filterOs();if(page==='report')updateReport()}function go(p){page=p;render();window.scrollTo({top:0,behavior:'smooth'})}document.querySelectorAll('.nav').forEach(x=>x.addEventListener('click',()=>go(x.dataset.page)));document.getElementById('currentUser').addEventListener('change',()=>render());render();
</script></body></html>
